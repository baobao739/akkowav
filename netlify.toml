# Security + anti-indexing for AkkoAudio

[build]
  # keep your existing publish dir if different
  publish = "."

# ---- Headers (all pages) ----
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Helpful against casual XSS; tighten further if you add analytics
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# Never index admin or function endpoints
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"
    Cache-Control = "no-store"

[[headers]]
  for = "/a/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"
    Cache-Control = "no-store"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# ---- Obscure admin path ----
# Public URL becomes /a/k7m2x9 (change the slug if you want)
# Old /admin.html still works but is noindexed; you can delete the file later.
[[redirects]]
  from = "/a/k7m2x9"
  to = "/admin.html"
  status = 200
  force = true

# Optional: make bare /admin bounce away (looks like 404)
[[redirects]]
  from = "/admin"
  to = "/"
  status = 302

[[redirects]]
  from = "/admin/"
  to = "/"
  status = 302
